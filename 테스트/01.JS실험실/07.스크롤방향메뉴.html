<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>
            /* 높이값 화면의 5배로 그라데이션 배경처리 */
            body {
                padding-bottom: 50vh;
                background-image: linear-gradient(to bottom, lightcoral, lightblue, lightgreen);

                margin: 0;
                font-family: sans-serif;
            }

            .header {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 60px;
                background: #4a90e2;
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 18px;
                transition: translate 0.3s ease; /* 부드럽게 숨김 효과 */
                z-index: 10;
            }

            .header.hide {
                translate: 0 -100%;
                /* transform: translateY(-100%); */
            }

            .content p {
                margin-top: 50vh;
                font-size: 4vh;
                text-align: center;
            }
        </style>
        <script>
            window.addEventListener("load", () => {

                // 변경대상 : 상단영역 .header
                const header = document.querySelector(".header");

                // 스크롤 방향 알아내는 원리:
                // (1) 아랫방향
                // 이전 스크롤위치값 < 현재 스크롤위치값
                // (2) 윗방향
                // 이전 스크롤위치값 > 현재 스크롤위치값

                // 이전 스크롤 위치값 저장변수
                let prevScroll = 0;

                // 스크롤 이벤트 설정하기
                window.addEventListener('scroll',()=>{

                    // 스크롤 위치값 구하기
                    let curScroll = window.scrollY;
                    // console.log('스크롤~~~~!', curScroll);

                    // (1) 아랫방향
                    // 이전 스크롤위치값 < 현재 스크롤위치값
                    if(prevScroll < curScroll){
                        console.log('스크롤 내려간다~~!');
                        // 스크롤 내려가면 메뉴 숨기기
                        header.classList.add('hide');
                    } /// if ////
                    // (2) 윗방향 : 아랫방향이 아니면 윗방향
                    // 이전 스크롤위치값 > 현재 스크롤위치값
                    else{
                        console.log('스크롤 올라간다~~!');
                        // 스크롤 올라가면 메뉴 보이기
                        header.classList.remove('hide');
                    } /// else ////

                    // 중요!!! 마지막에 이전스크롤위치를 저장!
                    prevScroll = curScroll;

                }); /////////// scroll ///////////////
 
            }); /// 로딩구역 ///////////////////////
        </script>
        <title>Document</title>
    </head>
    <body>
        <header class="header">내 멋진 헤더</header>
        <div class="content">
            <!-- 스크롤 테스트용 긴 내용 -->
            <p>스크롤 테스트용 컨텐츠입니다.</p>
            <p>스크롤 테스트용 컨텐츠입니다.</p>
            <p>스크롤 테스트용 컨텐츠입니다.</p>
            <p>스크롤 테스트용 컨텐츠입니다.</p>
            <p>스크롤 테스트용 컨텐츠입니다.</p>
            <p>스크롤 테스트용 컨텐츠입니다.</p>
            <p>스크롤 테스트용 컨텐츠입니다.</p>
            <p>스크롤 테스트용 컨텐츠입니다.</p>
            <p>스크롤 테스트용 컨텐츠입니다.</p>
            <p>스크롤 테스트용 컨텐츠입니다.</p>
        </div>
    </body>
</html>
