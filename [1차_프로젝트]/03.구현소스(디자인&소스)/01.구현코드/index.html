<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>위고 출판사</title>
    <!-- 메인 CSS -->
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <!-- 1. 상단영역 -->
    <div id="top-area">
      <header class="top-area inbox">
        <h2 class="temp-tit blind">1. 상단영역</h2>
        <!-- 상단영역 플렉스 부모박스 : .cont-box -->
        <div class="cont-box">
          <!-- 1-1. 로고박스 -->
          <section class="logo-box">
            <h1 class="logo">
              <a href="#">
                <img
                  src="../02.구현디자인/01.로고/위고 출판 logo.jfif"
                  alt="로고"
                />
              </a>
            </h1>
          </section>

          <!-- 1-2. 메뉴박스 -->
          <section class="menu-box">
            <!-- 메뉴박스 하위 메뉴그룹박스 -->
            <div class="menu-group">
              <!-- 1-2-1. 탑메뉴 -->
              <nav class="top-menu">
                <ul>
                  <li><a href="#">books</a></li>
                  <li><a href="#">Info</a></li>
                  <li><a href="#">Login</a></li>
                  <li><a href="#">KR</a></li>
                  <li><a href="#">ER</a></li>
                </ul>
              </nav>
            </div>
          </section>
        </div>
      </header>
    </div>

    <!-- 3. 상품영역 -->
    <div id="books-area">
      <main class="newbooks-area">
        <!-- 2-1. 뉴북스 -->
        <section class="banner-part">
          <h2 class="temp-tit">뉴 북스</h2>
        </section>

        <!-- 2-2. 캐릭터영역 -->
        <section class="cat-part inbox">
          <h2 class="temp-tit">2-2. 캐릭터영역</h2>
        </section>

        <!-- 2-3. 드라마소개영역 -->
        <section class="intro-part inbox">
          <h2 class="temp-tit">2-3. 드라마소개영역</h2>
        </section>

        <!-- 2-4. 미리보기영역 -->
        <section class="view-part inbox">
          <h2 class="temp-tit">2-4. 미리보기영역</h2>
        </section>

        <!-- 2-5. 현장포토영역 -->
        <section class="real-part inbox">
          <h2 class="temp-tit">2-5. 현장포토영역</h2>
        </section>

        <!-- 2-6. 대표포스터영역 -->
        <section class="poster-part inbox">
          <h2 class="temp-tit">2-6. 대표포스터영역</h2>
        </section>

        <!-- 2-7. 최신동영상영역 -->
        <section class="video-part inbox">
          <h2 class="temp-tit">2-7. 최신동영상영역</h2>
        </section>
      </main>
    </div>
    <!-- 3. 하단영역 -->
    <div id="bottom-area">
      <footer class="bottom-area inbox">
        <h2 class="temp-tit">3. 하단영역</h2>
      </footer>
    </div>

</html>
